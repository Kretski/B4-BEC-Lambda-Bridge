[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b4-8-proca-spectral-scan"
version = "0.1.0"
description = "Continuation tracking and complex-frequency diagnostics for the full Proca dispersion."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
